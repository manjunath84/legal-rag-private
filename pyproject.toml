[project]
name = "legal-rag-private"
description = "Private, on-device RAG over legal documents (GenAcademy Week 2, Stage 1)."
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40",
    "openai>=1.55",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raglab"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
